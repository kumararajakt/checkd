<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1C1F26;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D0F14;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3DFFC0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00C98A;stop-opacity:1" />
    </linearGradient>
    <filter id="checkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
    </pattern>
    <clipPath id="roundedClip">
      <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#grid)" clip-path="url(#roundedClip)"/>
  <circle cx="820" cy="200" r="260" fill="#3DFFC0" opacity="0.045"/>
  <circle cx="200" cy="830" r="200" fill="#3DFFC0" opacity="0.03"/>
  <rect x="270" y="290" width="320" height="18" rx="9" fill="#ffffff" opacity="0.07"/>
  <rect x="270" y="298" width="320" height="3" rx="1.5" fill="#3DFFC0" opacity="0.22"/>
  <rect x="270" y="352" width="260" height="18" rx="9" fill="#ffffff" opacity="0.07"/>
  <rect x="270" y="414" width="200" height="18" rx="9" fill="#ffffff" opacity="0.05"/>
  <rect x="192" y="283" width="52" height="52" rx="12" fill="none" stroke="#3DFFC0" stroke-width="3.5" opacity="0.9"/>
  <path d="M205 309 L218 322 L239 299" stroke="#3DFFC0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
  <rect x="192" y="345" width="52" height="52" rx="12" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.15"/>
  <rect x="192" y="407" width="52" height="52" rx="12" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.1"/>
  <g filter="url(#checkGlow)">
    <path d="M370 580 L490 700 L680 490" stroke="url(#checkGrad)" stroke-width="72" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
