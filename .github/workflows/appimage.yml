name: CI / AppImage

# Pull requests only run the checks. Pushing to master builds an AppImage
# artifact, and pushing a v* tag publishes it as a GitHub release.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri v2 needs webkit2gtk 4.1: on jammy that comes from jammy-updates
      # (2.50.4), the base release only ships 4.0.
      - name: Install the Linux dependencies Tauri needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget

      - run: bun install --frozen-lockfile

      - name: Typecheck and build the frontend
        run: bun run build

      - name: Run the Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  appimage:
    name: AppImage
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri v2 needs webkit2gtk 4.1: on jammy that comes from jammy-updates
      # (2.50.4), the base release only ships 4.0.
      - name: Install the Linux dependencies Tauri needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget

      # The bundler downloads linuxdeploy & co. into ~/.cache/tauri — caching
      # them keeps the build off the network (and off the flaky GitHub CDN).
      - name: Cache the AppImage bundling tools
        uses: actions/cache@v6
        with:
          path: ~/.cache/tauri
          key: tauri-bundle-tools-${{ runner.os }}-${{ hashFiles('bun.lock', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-bundle-tools-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Build the AppImage
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          CHECKD_BUILTIN_CLIENT_ID: ${{ secrets.CHECKD_GOOGLE_CLIENT_ID }}
          CHECKD_BUILTIN_CLIENT_SECRET: ${{ secrets.CHECKD_GOOGLE_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAG" ]; then
            # A tagged build takes its version from the tag (v1.2.3 -> 1.2.3).
            bun run tauri build --bundles appimage \
              --config "{\"version\":\"${TAG#v}\"}"
          else
            bun run tauri build --bundles appimage
          fi

      - name: Upload the AppImage
        uses: actions/upload-artifact@v7
        with:
          name: checkd-appimage
          path: src-tauri/target/release/bundle/appimage/*
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          SIG_FILE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig 2>/dev/null || ls src-tauri/target/release/bundle/appimage/*.AppImage.sig 2>/dev/null || true)
          TAR_FILE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz 2>/dev/null || ls src-tauri/target/release/bundle/appimage/*.AppImage 2>/dev/null || true)

          if [ -n "$SIG_FILE" ] && [ -f "$SIG_FILE" ]; then
            SIG=$(cat "$SIG_FILE")
            TAR_NAME=$(basename "$TAR_FILE")
            VERSION="${TAG#v}"
            PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            printf '{\n  "version": "%s",\n  "notes": "checkd release %s",\n  "pub_date": "%s",\n  "platforms": {\n    "linux-x86_64": {\n      "signature": "%s",\n      "url": "https://github.com/kumararajakt/checkd/releases/download/%s/%s"\n    }\n  }\n}\n' \
              "$VERSION" "$TAG" "$PUB_DATE" "$SIG" "$TAG" "$TAR_NAME" > latest.json
          fi

          FILES=(src-tauri/target/release/bundle/appimage/*)
          if [ -f latest.json ]; then
            FILES+=(latest.json)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "checkd $TAG" \
              --generate-notes
          fi
