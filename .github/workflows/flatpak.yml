name: Flatpak Build & Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0). Required if triggering manually to publish a release.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  flatpak:
    name: Build Flatpak Bundle
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: com.kumar.checkd.flatpak
          manifest-path: com.kumar.checkd.yml
          cache: true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.kumar.checkd.flatpak
          path: com.kumar.checkd.flatpak
          if-no-files-found: error

      - name: Upload Flatpak Bundle to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        uses: softprops/action-gh-release@v2
        with:
          files: com.kumar.checkd.flatpak
          tag_name: ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
